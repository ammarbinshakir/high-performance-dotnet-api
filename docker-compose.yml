services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: performance-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=performance_api;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Database__ApplyMigrationsOnStartup: "true"
      RateLimiting__Enabled: ${RATE_LIMITING_ENABLED:-true}
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    container_name: performance-postgres
    environment:
      POSTGRES_DB: performance_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d performance_api"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: performance-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
